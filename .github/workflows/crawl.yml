name: Scan simple proxies

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pyyaml
      
      # Input 1: plain HTTP forward proxies (handshake + TLS tunnel
      # check to opencode.ai) -> http_nodes.json
      - name: Scan HTTP proxies
        run: python3 scan_simple.py
      
      # subs-check v1.6.5 (pinned): tests subscription nodes through
      # the mihomo core. Liveness only — speed-test-url is empty in
      # both configs, so the speed stage is skipped entirely.
      - name: Download subs-check
        run: |
          curl -sL -o subs-check.tar.gz https://github.com/beck-8/subs-check/releases/download/v1.6.5/subs-check_Linux_x86_64.tar.gz
          # NOTE: extract into .bin/ — a plain `tar xzf ... subs-check`
          # fails because the repo already has a subs-check/ config dir.
          mkdir -p .bin && tar xzf subs-check.tar.gz -C .bin subs-check
          test -x .bin/subs-check && echo "subs-check binary OK"
      
      # Input 2a: subscription nodes, alive = any 2xx from gstatic
      - name: Check subscription nodes (full pool)
        run: bash run_subs_check.sh subs-check/config-full.yaml output-full subs-check-full.log
      
      # Input 2b: subscription nodes, alive = 2xx from opencode.ai
      - name: Check subscription nodes (AI tier)
        run: bash run_subs_check.sh subs-check/config-ai.yaml output-ai subs-check-ai.log
      
      # Merge everything into tiered Clash YAML outputs.
      - name: Build tiered outputs
        run: python3 tier_outputs.py
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clash.yaml residential.yaml ai.yaml
          git diff --staged --quiet || git commit -m "Daily proxy scan: $(date -u +%Y-%m-%d)"
          git push
